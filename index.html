render();persist()}

function hash(n){let x=(n+1)*2654435761>>>0;x^=x>>>16;x=Math.imul(x,2246822507)>>>0;return(x^(x>>>13))>>>0}
function poly(points,fill,stroke='#7fa0ab',sw=1){return `<polygon points="${points}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`}
function iso(X,Y,Z=0){return [430+(X-Y)*30,165+(X+Y)*15-Z]}
function rectIso(x,y,w,h,z,fill,stroke='#73969b'){const p=[iso(x,y,z),iso(x+w,y,z),iso(x+w,y+h,z),iso(x,y+h,z)];return poly(p.map(x=>x.join(',')).join(' '),fill,stroke)}
function block(x,y,w,h,height,top,side='#496578',edge='#749aa8'){const a=iso(x,y,0),b=iso(x+w,y,0),c=iso(x+w,y+h,0),d=iso(x,y+h,0),aa=iso(x,y,height),bb=iso(x+w,y,height),cc=iso(x+w,y+h,height),dd=iso(x,y+h,height);return poly([b,c,cc,bb].map(p=>p.join(',')).join(' '),side,edge)+poly([d,c,cc,dd].map(p=>p.join(',')).join(' '),'#3d586c',edge)+poly([aa,bb,cc,dd].map(p=>p.join(',')).join(' '),top,edge)}

function workstation(x,y,k){const u=G.employees[k];const desk=block(x,y,1.8,.92,19,'#caa985','#997755','#dfc29b');const p=iso(x+.76,y+.43,20);const scr=`<g><path d="M${p[0]-5},${p[1]+1} l0,-27 31,-15 0,27z" fill="#263a52" stroke="#7ca6b9" stroke-width="2"/><path d="M${p[0]-1},${p[1]-4} l0,-20 23,-10 0,20z" fill="#51b3ba"/><path d="M${p[0]+8},${p[1]+4}v7h13" stroke="#465764" stroke-width="2" fill="none"/></g>`;

const rawCap=cap;cap=function(){return accList().filter(usable).reduce((s,d)=>s+(d.type==='access'?20:40),0)};
function switchTo(id){const d=G.devices.find(x=>x.id===id);if(!d){inform('尚未安裝這台設備');return}selectedDevice=d.id;consoleLines=[];termLine(`連線至 ${d.id} · ${devDef[d.type]?.model||d.type}`, 'output');termLine('輸入 enable 開始設定。? 顯示支援的指令。','output');renderTerm()}
function termLine(str,type='output'){consoleLines.push({s:String(str),type});if(consoleLines.length>160)consoleLines=consoleLines.slice(-160);if(page==='term')updateTerminal()}
function prompt(d){const m=cliModes[d.id]||{type:'user'};return d.hostname+(m.type==='user'?'>':m.type==='exec'?'#':m.type==='config'?'(config)#':m.type==='vlan'?'(config-vlan)#':'(config-if)#')}

function updateTerminal(){const el=$('#terminal');if(!el)return;el.innerHTML=consoleLines.map(x=>`<div class="${x.type}">${safe(x.s)}</div>`).join('');el.scrollTop=el.scrollHeight}
function showRun(d){let s=`Building configuration...\nhostname ${d.hostname}\n`;if(d.routing)s+='ip routing\n';d.vlans.forEach(v=>{s+=`vlan ${v}\n`;if(d.svi[v])s+=`interface Vlan${v}\n ip address ${d.svi[v]} 255.255.255.0\n no shutdown\n`});if(d.trunk)s+='interface GigabitEthernet0/1\n switchport mode trunk\n switchport trunk allowed vlan '+(d.allowed||'10,20')+'\n';Object.entries(d.ports).forEach(([port,conf])=>{s+=`interface ${port}\n switchport mode access\n switchport access vlan ${conf.access||1}\n`});return s+'end\n' +(d.saved?'[Startup configuration saved]':'[Unsaved running-config changes]')}
function cliProcess(cmd){const d=chosen();if(!d){termLine('機房尚無可連線設備。請至「建置」採購路由器、交換器。','error');return}const line=cmd.trim();const m=cliModes[d.id]||(cliModes[d.id]={type:'user',iface:null});termLine(prompt(d)+' '+line,'prompt');if(!line)return;
const c=line.toLowerCase().replace(/\s+/g,' '),parts=c.split(' ');let out='';
if(c==='?'||c==='help'){out='支援：enable / configure terminal / hostname NAME / vlan 10 / interface vlan 10 / ip address / no shutdown / ip routing / switchport mode trunk / switchport trunk allowed vlan 10,20 / show vlan brief / show ip interface brief / show interfaces trunk / show running-config / show inventory / ping / copy running-config startup-config / exit / end';}
else if(['enable','en'].includes(c)){m.type='exec';m.iface=null}
else if(c==='disable'){m.type='user';m.iface=null}
else if(['conf t','configure terminal','configure t'].includes(c)){if(m.type==='user')out='% Need enable first';else{m.type='config';m.iface=null}}
else if(c==='end'||c==='ctrl+z'){m.type='exec';m.iface=null}
else if(c==='exit'){if(m.type==='user')out='Already in User EXEC';else if(m.type==='exec')m.type='user';else{m.type='config';m.iface=null}}
else if(c.startsWith('hostname ')){if(m.type==='config'){d.hostname=line.split(/\s+/).slice(1).join('-');d.saved=false}else out='% Only allowed in global configuration mode'}
else if(c==='ip routing'||c==='no ip routing'){if(m.type==='config'&&d.type==='core'){d.routing=c==='ip routing';d.saved=false;out='IP routing '+(d.routing?'enabled':'disabled')}else out='% Only available on core switch in global config mode'}
else if(/^vlan \d+$/.test(c)){if(m.type!=='config'&&m.type!=='vlan')out='% Enter configure terminal first';else{const v=+parts[1];if(v>=1&&v<=4094){if(!d.vlans.includes(v))d.vlans.push(v);d.saved=false;m.type='vlan';out=`VLAN ${v} created / selected`;}else out='% Invalid VLAN'}}
else if(c.startsWith('interface ')){if(!['config','iface','vlan'].includes(m.type))out='% Enter configure terminal first';else{let ifc=line.substring(line.indexOf(' ')+1).toLowerCase().replace(/\s+/g,'');ifc=ifc.replace(/^gigabitethernet/,'gi').replace(/^fastethernet/,'fa');ifc=ifc.replace(/^vlan(\d+)$/,'vlan$1');if(!/^(vlan\d+|gi\d+(\/\d+){1,2}|fa\d+(\/\d+){1,2})$/.test(ifc))out='% Invalid interface';else{m.type='iface';m.iface=ifc;out='interface '+ifc}}}
else if(c.startsWith('ip address ')){if(m.type!=='iface'||!m.iface?.startsWith('vlan'))out='% ip address must be configured under interface Vlan10';else{const ip=parts[2];if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip))out='% Invalid IP address';else{const v=+m.iface.substring(4);d.svi[v]=ip;d.saved=false;out=`Interface Vlan${v}: ${ip}`}}}
else if(c==='no shutdown'){if(m.type!=='iface')out='% Select interface first';else{d.saved=false;if(m.iface.startsWith('gi')){d.online=true;out='Interface changed state to up'}else if(m.iface.startsWith('fa')){d.ports[m.iface]??={};d.ports[m.iface].shut=false;out='Port enabled'}else out='Interface enabled'}}
else if(c==='shutdown'){if(m.type!=='iface')out='% Select interface first';else{d.saved=false;if(m.iface.startsWith('gi'))d.online=false;else if(m.iface.startsWith('fa')){d.ports[m.iface]??={};d.ports[m.iface].shut=true}out='Interface administratively down'}}
else if(c==='switchport mode trunk'){if(m.type!=='iface')out='% Select interface first';else if(!m.iface.startsWith('gi'))out='% Please select GigabitEthernet uplink';else{d.trunk=true;d.saved=false;out='Operational trunk mode configured'}}
else if(c.startsWith('switchport trunk allowed vlan ')){if(m.type!=='iface')out='% Select interface first';else{d.allowed=line.split(' ').slice(-1)[0];d.saved=false;out=`Trunk allowed VLANs: ${d.allowed}`}}
else if(c==='switchport mode access'){if(m.type!=='iface')out='% Select a port';else {d.ports[m.iface]??={};d.ports[m.iface].mode='access';d.saved=false;out='Port mode access'}}
else if(c.startsWith('switchport access vlan ')){if(m.type!=='iface')out='% Select access port';else {const v=+parts.at(-1);if(!d.vlans.includes(v))out=`% VLAN ${v} does not exist on this device`;else{d.ports[m.iface]??={};d.ports[m.iface].access=v;d.ports[m.iface].shut=false;d.saved=false;out=`${m.iface} assigned VLAN ${v}`}}}
else if(c==='copy running-config startup-config'||c==='copy run start'||c==='write memory'||c==='wr mem'){if(m.type==='user')out='% Enter enable first';else{d.saved=true;out='Building configuration...\n[OK] Startup-config updated';addLog(`${d.id} 設定已寫入 NVRAM`)}}
else if(c==='show inventory'){out=`NAME: ${d.id}\nPID: ${devDef[d.type]?.model||d.type}\nSTATUS: ${d.online?'Power On':'Shutdown'}\nUPLINK: ${d.linked?'Connected':'Not cabled'}`}
else if(c==='show vlan brief'||c==='show vlan'){out='VLAN  Name               Status    Ports\n1     default            active\n'+d.vlans.sort((a,b)=>a-b).map(v=>`${String(v).padEnd(5)} VLAN${v}              active`).join('\n')}
else if(['show ip interface brief','show ip int brief','show ip int br'].includes(c)){out='Interface              IP-Address        Status     Protocol\n'+Object.entries(d.svi).map(([v,ip])=>`Vlan${String(v).padEnd(17)}${String(ip).padEnd(18)}${d.online?'up         up':'down       down'}`).join('\n')+(d.type==='core'&&d.routing?'\nIP Routing: enabled':'')}
else if(c==='show interfaces trunk'||c==='show interface trunk'||c==='show trunk'){out=d.trunk?`Port      Mode  Encapsulation  Status      Vlans allowed\nGi0/1     on    802.1q         trunking    ${d.allowed||'all'}`:'No interfaces are trunking'}
else if(['show running-config','show run'].includes(c)){out=showRun(d)}
else if(['show startup-config','show start'].includes(c)){out=d.saved?'Startup-config stored successfully.\n'+showRun(d):'Startup-config not saved'}
else if(c==='show interfaces status'||c==='show interface status'){out='Port        Status         VLAN      Connected\n'+Array.from({length:Math.min(24,d.type==='access48'?48:24)},(_,i)=>{const p=`fa0/${i+1}`,cfg=d.ports[p]||{};return `${p.padEnd(12)}${cfg.shut?'disabled       ':'connected      '}${String(cfg.access||10).padEnd(10)}${(d.assigned||0)>i?'PC':'--'}`}).join('\n')}
else if(c.startsWith('ping ')){const ip=parts.at(-1);const core=G.devices.find(x=>x.type==='core');const sw=accList()[0];if(ip==='10.10.10.1'&&core?.routing&&core?.svi?.[10]&&sw?.trunk)out='!!!!!\nSuccess rate is 100 percent (5/5)';else if(ip==='8.8.8.8'&&G.infra.cabled&&G.infra.isp)out='!!!!!\nSuccess rate is 100 percent (5/5)';else out='.....\nSuccess rate is 0 percent (0/5)';}
else if(c==='show version'){out='Cisco IOS XE Software [模擬版 v0.4]\nNetwork Architect Simulator · educational simplified engine';}
else if(c.startsWith('show '))out='% Unimplemented simulated show command. Try ?';
else out=`% Invalid input detected: ${line}\nType ? to view supported commands.`;
if(out)termLine(out,out.startsWith('%')?'error':'output');G.devices.forEach(x=>x.online=x.online!==false);renderTop();if(G.infra.opened)wiredPlan();updateTermHelp();persist()}
function renderTerm(){const e=$('#device-row');e.innerHTML=G.devices.length?G.devices.map(d=>`<button class="${d.id===chosen()?.id?'active':''}" data-dev="${safe(d.id)}">${safe(d.id)} ${usable(d)?'●':''}</button>`).join(''):'<span class="muted" style="font-size:12px">尚未購買設備。先去「建置」。</span>';$$('[data-dev]',e).forEach(b=>b.onclick=()=>switchTo(b.dataset.dev));if(!consoleLines.length){const d=chosen();if(d){selectedDevice=d.id;termLine('已連線 '+d.id+' · 輸入 enable 再輸入 configure terminal') }else termLine('機房尚無設備：從零建置模式，請先完成採購。')}updateTermHelp();updateTerminal()}
function updateTermHelp(){const t=G.tickets.find(t=>t.id===G.activeId);const txt=t?`目前工單：${t.title}｜指定設備 ${t.device}。${t.evidence?'證據：'+t.evidence:'請先到工單頁收集證據'}。修好後返回工單按「驗證結案」。`:G.infra.opened?`可透過設備列切換目前的 ${G.devices.length} 台設備。以 show vlan brief / show interface status / show interfaces trunk 觀察狀態。新交換器可使用建置頁的部署範本。`:'開業前驗收：在 CORE-SW1 執行 enable → conf t → ip routing → vlan 10 → interface vlan 10 → ip address 10.10.10.1 255.255.255.0 → no shutdown → end → copy run start；在 SW-01 設定 VLAN 10 與上行 Gi0/1 Trunk，最後也要存檔。';$('#term-help-text').textContent=txt;$('#term-help-text').hidden=!termDetails}

function createTicket(force){if(!G.infra.opened||!G.employees.length)return;const pending=G.tickets.filter(t=>['pending','active'].includes(t.status)).length;if(pending>=5&&!force)return;const idx=G.ticketSeq++;const emp=G.employees[(idx*7+3)%G.employees.length];const type=TEMPLATES[(idx*3+Math.floor(idx/3))%TEMPLATES.length];const device=G.devices.find(x=>x.id===emp.switch)||accList()[0];if(!device)return;const port=emp.port||'Fa0/1';const ticket={id:'TK-'+String(idx+1).padStart(4,'0'),owner:emp.id,who:emp.name,dept:emp.dept,title:type.title,desc:type.desc,evidence:'',work:type.work,kind:type.kind,device:device.id,port,status:'pending',checked:false,fixed:false,created:G.totalMin};
if(type.kind==='vlan'){device.ports[port.toLowerCase()]??={};device.ports[port.toLowerCase()].access=20}
if(type.kind==='link')device.online=false;
G.tickets.push(ticket);addLog(`收到工單 ${ticket.id}：${ticket.title}／${emp.name}`);inform(`📨 新工單 ${ticket.id}｜${ticket.title}`);G.lastTicketAt=G.totalMin;render();persist()}
function pendingTickets(){return G.tickets.filter(t=>t.status==='pending')}
function activeTicket(){return G.tickets.find(t=>t.id===G.activeId)}
function selectedTicket(){if(G.ticketTab==='active')return activeTicket();const src=G.ticketTab==='history'?G.tickets.filter(t=>['closed','rejected'].includes(t.status)).slice().reverse():pendingTickets();ticPage=Math.min(Math.max(ticPage,0),Math.max(0,src.length-1));return src[ticPage]}
function acceptTicket(id){if(G.activeId){inform('必須先完成目前接受的工單');return}const t=G.tickets.find(x=>x.id===id);if(!t||t.status!=='pending')return;t.status='active';G.activeId=id;G.ticketTab='active';ticPage=0;inform('已接受 '+id+'，處理完成前不能接其他工單');render();persist()}
function rejectTicket(id){if(G.activeId){inform('先完成正在處理的工單');return}const t=G.tickets.find(x=>x.id===id);if(!t||t.status!=='pending')return;modal('確認拒絕這張工單？',`工單 ${safe(t.id)}<br>${safe(t.title)}<br>${t.kind==='invalid'?'不合理要求可以直接拒絕且不扣滿意度。':'這是正常維運需求，無正當理由拒單會降低滿意度 4 點。'}`,[{text:'確定拒絕',cls:'danger',click:()=>{t.status='rejected';G.rejected++;if(t.kind==='invalid')G.satisfaction=Math.min(100,G.satisfaction+1);else G.satisfaction=Math.max(0,G.satisfaction-4);addLog(`${t.id} 已拒絕`);ticPage=0;render();persist()}},{text:'返回',click:()=>{}}])}
function collectEvidence(){const t=activeTicket();if(!t)return;t.checked=true;t.evidence=TEMPLATES.find(x=>x.kind===t.kind)?.evidence||'檢查完成';inform('已記錄檢查結果，現在可以執行修復');render();persist()}
function repairTicket(){const t=activeTicket();if(!t||!t.checked){inform('請先收集證據');return}if(t.kind==='vlan'||t.kind==='link'){selectedDevice=t.device;switchTo(t.device);nav('term');inform('請用 CLI 修復，完成後回工單驗證');return}
if(t.kind==='invalid'){inform('這類不合理工單原則上應先拒絕，若已接受可聯絡提出者改走資安申請');t.fixed=true;render();return}
t.fixed=true;const msg=t.kind==='dhcp'?'已執行 ipconfig /release、/renew，取得 10.10.10.x':t.kind==='dns'?'已執行 ipconfig /flushdns 並重新 nslookup': '已重新啟動 Print Spooler，清除卡住的列印佇列';t.evidence+='\n'+msg;inform(msg);render();persist()}
function verifyTicket(){const t=activeTicket();if(!t)return;if(!t.checked){inform('請先檢查證據');return}const d=G.devices.find(x=>x.id===t.device);let ok=t.fixed;if(t.kind==='vlan')ok=(d?.ports[t.port.toLowerCase()]?.access===10);if(t.kind==='link')ok=d?.online===true;if(!ok){inform('驗證未通過：故障狀態仍存在，請回到設備排除');return}t.status='closed';t.closed=G.totalMin;G.activeId=null;G.finished++;G.satisfaction=Math.min(100,G.satisfaction+2);G.money+=8000;addLog(`${t.id} 驗證通過並結案，服務收入 +NT$8,000`);inform('✅ 工單結案，現在可以接受下一張');G.ticketTab='pending';ticPage=0;render();persist()}
function ticketDetails(t){const active=t.status==='active';const typ=TEMPLATES.find(x=>x.kind===t.kind);const stat=t.status==='pending'?'待接受':active?'處理中':t.status==='closed'?'已結案':'已拒絕';const step=active?(t.checked?'② 依證據處置並驗證':'① 先查詢證據'):'等待處理';return `<div class="ticket-card"><div class="ticket-title">${safe(t.id)}｜${safe(t.title)}</div><div class="ticket-meta">${safe(t.who)}・${safe(t.dept)}｜${stat}｜設備 ${safe(t.device)} / ${safe(t.port)}</div><div class="ticket-detail">${safe(t.desc)}</div><div class="ticket-evidence"><b>${step}</b><div>${t.evidence?safe(t.evidence):active?'點「檢查故障」進行現場排查。':safe(typ?.evidence||'')}</div></div><div class="ticket-ops">${active?`<button class="secondary" id="go-device">🖥 前往指定設備 ${safe(t.device)}</button>${!t.checked?'<button class="primary" id="inspect-ticket">🔎 檢查故障、收集證據</button>':`<button class="secondary" id="fix-ticket">🛠 ${t.kind==='vlan'||t.kind==='link'?'使用 CLI 排除故障':'執行現場修復'}</button><button class="primary" id="verify-ticket">✅ 驗證修復、完成結案</button>`}`:t.status==='pending'?`<div class="ticket-btns"><button class="primary" id="accept-ticket" ${G.activeId?'disabled':''}>✓ 接受工單</button><button class="danger" id="reject-ticket" ${G.activeId?'disabled':''}>✕ 拒絕工單</button></div>`:'<button class="secondary" id="go-device">查看相關設備</button>'}</div></div>`}
function renderTickets(){$$('[data-ticket-tab]').forEach(b=>b.classList.toggle('active',b.dataset.ticketTab===G.ticketTab));const body=$('#ticket-body');const src=G.ticketTab==='active'?G.tickets.filter(t=>t.status==='active'):G.ticketTab==='history'?G.tickets.filter(t=>t.status==='closed'||t.status==='rejected').slice().reverse():pendingTickets();if(!src.length){const text=G.ticketTab==='pending'?'目前沒有待接工單，網路運行正常。':G.ticketTab==='active'?'尚未接受任何工單。先切回「待接」。':'還沒有結案紀錄。';body.innerHTML=`<div class="empty-state"><div class="iconbig">${G.ticketTab==='pending'?'📭':'🗂'}</div><b>${text}</b><p>接受工單後一次只處理一張；<br>不合理的要求可以拒絕。</p>${G.infra.opened?'<button class="secondary" id="spawn-ticket">模擬一張報修（練習）</button>':'<button class="secondary" id="go-open">先完成網路建置</button>'}</div>`;$('#spawn-ticket')?.addEventListener('click',()=>createTicket(true));$('#go-open')?.addEventListener('click',()=>nav('build'));return}ticPage=Math.min(Math.max(ticPage,0),src.length-1);const t=src[ticPage];body.innerHTML=`${ticketDetails(t)}<div class="pager"><button id="ticket-prev" ${ticPage===0?'disabled':''}>‹ 前一張</button><span>${ticPage+1} / ${src.length}</span><button id="ticket-next" ${ticPage>=src.length-1?'disabled':''}>下一張 ›</button></div>`;$('#ticket-prev').onclick=()=>{ticPage--;renderTickets()};$('#ticket-next').onclick=()=>{ticPage++;renderTickets()};$('#accept-ticket')?.addEventListener('click',()=>acceptTicket(t.id));$('#reject-ticket')?.addEventListener('click',()=>rejectTicket(t.id));$('#inspect-ticket')?.addEventListener('click',collectEvidence);$('#fix-ticket')?.addEventListener('click',repairTicket);$('#verify-ticket')?.addEventListener('click',verifyTicket);$('#go-device')?.addEventListener('click',()=>{selectedDevice=t.device;switchTo(t.device);nav('term')})}
const LESSONS=[
{title:'第一天：你是唯一的網路工程師',desc:'公司還沒開業。先準備機櫃、ISP 與網路設備。現場設備不會憑空出現，每項採購都會扣除遊戲內建置預算。',tip:'先買機櫃，再簽 ISP 企業光纖。接著採購路由器、防火牆、CORE、Access SW，最後施工上聯線。',code:'建置 → 基礎設施 → 機櫃 / ISP\n建置 → 網路設備 → 路由器 / 防火牆 / CORE / SW\n建置 → 基礎設施 → 設備線路施工'},
{title:'分層架構與設備角色',desc:'Access SW 把終端 PC 接上網路。CORE SW 負責彙整 VLAN 與跨 VLAN 路由。防火牆控管安全政策；邊界路由器把網路送往 ISP。',tip:'典型簡化路徑：PC → Access → Core → Firewall → Router → ISP。小企業可以採折疊核心；遊戲為了學習而保留清楚的角色。',code:'PC — Fa0/1 — SW-01 — Gi0/1 — CORE-SW1\nCORE-SW1 — FW-EDGE — RTR-EDGE — ISP'},
{title:'VLAN 與 Trunk：第一次 CLI 建置',desc:'VLAN 是獨立的二層廣播網域。接入埠給 PC 使用 VLAN 10；交換器之間的 uplink 使用 802.1Q Trunk 傳送 VLAN。',tip:'先選 CORE-SW1，在終端機逐行輸入以下指令。Enter 後才會送出。VLAN 與 Trunk 必須分別在 CORE 和 SW 上設定。',device:'CORE-SW1',code:'enable\nconfigure terminal\nip routing\nvlan 10\nexit\ninterface vlan 10\nip address 10.10.10.1 255.255.255.0\nno shutdown\nend\ncopy running-config startup-config'},
{title:'Access Switch：設定上聯',desc:'Access Switch 需建立 VLAN 10，並把上聯 Gi0/1 設定為 Trunk，通過 CORE 的 VLAN 10 網路。',tip:'選 SW-01，照順序輸入以下設定。若沒有建立 VLAN，即使 Trunk 正常，端點仍可能無法使用該 VLAN。',device:'SW-01',code:'enable\nconfigure terminal\nvlan 10\nexit\ninterface gi0/1\nswitchport mode trunk\nswitchport trunk allowed vlan 10,20\nno shutdown\nend\ncopy running-config startup-config'},
{title:'驗收：show 與 ping',desc:'工程完成後不要只說「我設定好了」。要確認 running-config、VLAN、Interface 和連線驗證。',tip:'在 CORE 查看 show ip interface brief，確認 VLAN 10 的 IP 和路由；在 Access 查看 show interfaces trunk。最後兩台都必須 copy run start。',device:'CORE-SW1',code:'show vlan brief\nshow ip interface brief\nshow interfaces trunk\nping 10.10.10.1\ncopy running-config startup-config'},
{title:'招募與交換器容量',desc:'本遊戲以每位員工一台有線電腦為基礎。24 Port SW 規劃 20 個員工 Port，預留上聯與擴充；48 Port SW 規劃 40 個。員工與 Port 真正一一對應。',tip:'當容量不夠時，先到建置 → 招募擴編購買交換器，再部署設定範本，才可以繼續招聘。300 名有線員工、每台 20 Port 時，需 15 台 24 Port SW。',code:'300 員工 ÷ 20 員工 Port / 24 Port SW = 15 台\n※ 實務還要考慮 AP、電話、印表機、樓層配線與備援。'},
{title:'工單：接受、拒絕與設備定位',desc:'待接工單可接受或拒絕，但一次只能接受一張。接受後，要收集證據、用 CLI 或現場工具修復、驗證成功才能結案。',tip:'工單內「前往指定設備」會自動選取對應 SW；遇到 VLAN 錯誤時，請設定指定 Fa0/x 而不是隨便選一個埠。',code:'show interfaces status\nconfigure terminal\ninterface fa0/7\nswitchport mode access\nswitchport access vlan 10\nend'},
{title:'時間規則與營運成長',desc:'時間完全自動：0 張工單為 10 倍速，1~4 張工單為 1 倍速，5 張以上會暫停。完成工單或合理拒絕工單，才會讓時間繼續。',tip:'這個規則會在公司開業後自動啟動。員工成長解鎖 50+ 人的企業擴張與 300+ 人的大型企業階段；沒有固定的人數終點。',code:'0 張工單 → 10×\n1 ~ 4 張工單 → 1×\n5 張以上工單 → 暫停'},
{title:'大型企業：監控、冗餘與資安',desc:'300 人以上不應只看員工數字。之後要規劃多台 Access SW 的管理、監控、PoE、HA 防火牆與分公司 WAN/VPN；核心設備故障應影響對應使用者。',tip:'v0.4 已能以員工數量推進企業階段、增加實際 Access SW 與開設分公司；高階路由協定及詳細 HA 故障模擬仍在後續開發範圍。',code:'show inventory\nshow interfaces status\nshow running-config\n! 進階規劃：HSRP、OSPF、BGP、IPsec VPN、SNMP'}
];
function renderLearn(){const idx=Math.min(Math.max(0,G.lesson),LESSONS.length-1),e=LESSONS[idx];const chunks=e.code.split("\n"),pages=Math.ceil(chunks.length/6);learnStep=Math.min(learnStep,pages-1);const clipped=chunks.slice(learnStep*6,learnStep*6+6).join("\n");$('#learn-count').textContent=`${idx+1} / ${LESSONS.length}`;$('#learn-panel').innerHTML=`<div class="flowhint">第 ${idx+1} 課 · 新人實務訓練 ${G.learnOn?'（教學提示開啟）':'（精簡提示）'}</div><h2>${safe(e.title)}</h2><p>${safe(e.desc)}</p><div class="learn-chunk">💡 ${safe(e.tip)}</div><div class="learn-code">${safe(clipped)}</div>${pages>1?`<div class="pager"><button id="prev-cmd" ${learnStep===0?"disabled":""}>‹ 上一組指令</button><span>指令 ${learnStep+1} / ${pages} 組</span><button id="next-cmd" ${learnStep>=pages-1?"disabled":""}>下一組指令 ›</button></div>`:""}<div class="learn-actions"><button class="ghost" id="prev-lesson" ${idx===0?'disabled':''}>← 上一課</button><button class="secondary" id="learn-demo">${e.device?'前往 '+e.device:'前往操作'}</button><button class="primary" id="next-lesson">${idx===LESSONS.length-1?'回第一課':'下一課 →'}</button></div>`;$('#prev-lesson').onclick=()=>{G.lesson--;learnStep=0;renderLearn();persist()};$('#next-lesson').onclick=()=>{G.lesson=(G.lesson+1)%LESSONS.length;learnStep=0;renderLearn();persist()};$('#prev-cmd')?.addEventListener('click',()=>{learnStep--;renderLearn()});$('#next-cmd')?.addEventListener('click',()=>{learnStep++;renderLearn()});$('#learn-demo').onclick=()=>{if(e.device){selectedDevice=e.device;if(!G.devices.some(x=>x.id===e.device)){inform('這個教學設備尚未採購／安裝，請先建置');nav('build')}else{switchTo(e.device);nav('term')}}else nav('build')}}
function tick(){if(!G.infra.opened)return;const sp=speed();if(!sp)return;G.totalMin+=sp;G.minute+=sp;while(G.minute>=1440){G.minute-=1440;G.day++;const revenue=Math.round(G.employees.length*240);G.money+=revenue;addLog(`企業營運收入 +${dollars(revenue)}（依員工數）`)}// each half game-day at idle, much slower after outstanding tickets
if(G.totalMin-G.lastTicketAt>=Math.max(160,250-G.employees.length/10)&&G.employees.length>0)createTicket(false);
renderTop();const cl=Math.floor(G.minute/60)+':'+String(Math.floor(G.minute%60)).padStart(2,'0');if(G.day%5===0)persist();const lbl=$('#current-quest');if(lbl&&page==='office'&&G.totalMin%20===0)renderOffice()}
function nav(n){const arr=['office','build','term','tickets','learn'];if(!arr.includes(n))return;page=n;$$('.screen').forEach(el=>el.classList.toggle('active',el.id==='view-'+n));$$('.nav').forEach(el=>el.classList.toggle('active',el.dataset.view===n));render();persist()}
function render(){renderTop();if(page==='office')renderOffice();if(page==='build')renderBuild();if(page==='term')renderTerm();if(page==='tickets')renderTickets();if(page==='learn')renderLearn()}
// Audio synthesis, three soundtracks, controlled by a real volume slider and initiated only by a user gesture.
const MUSIC_PRESETS=[{name:'LO-FI OFFICE',bpm:85,notes:[0,4,7,11,9,5,2,7],root:49,wave:'sine'},{name:'TECH AMBIENT',bpm:104,notes:[0,7,12,9,5,9,7,4],root:45,wave:'triangle'},{name:'MISSION MODE',bpm:128,notes:[0,3,7,10,7,3,5,10],root:46,wave:'sawtooth'}];
let ac=null,master=null,playTimer=null,beat=0;
function stopMusic(){if(playTimer){clearInterval(playTimer);playTimer=null}if(ac){ac.close().catch(()=>{});ac=null}master=null;G.sound=false;$('#music').classList.remove('on');persist()}
function note(f,dur,vol=.1,wave='sine',delay=0){if(!ac||!master)return;const osc=ac.createOscillator(),gain=ac.createGain(),filter=ac.createBiquadFilter();const st=ac.currentTime+delay;osc.type=wave;osc.frequency.setValueAtTime(f,st);filter.type='lowpass';filter.frequency.value=wave==='sawtooth'?900:2600;gain.gain.setValueAtTime(0.0001,st);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,vol),st+.04);gain.gain.exponentialRampToValueAtTime(.0001,st+dur);osc.connect(filter).connect(gain).connect(master);osc.start(st);osc.stop(st+dur+.04)}
function playBeat(){if(!ac||!G.sound)return;const p=MUSIC_PRESETS[G.soundStyle],val=p.notes[beat%p.notes.length];let f=440*Math.pow(2,(p.root+val-69)/12);note(f,.23,.14,p.wave);if(beat%2===0)note(f/2,.43,.065,'triangle');if(beat%4===0){note(f/4,1,.035,'sine');note(f*1.5,.5,.024,'sine')}beat++;}
function startMusic(){if(!window.AudioContext&&!window.webkitAudioContext){inform('目前的瀏覽器不支援音樂合成');return}if(G.sound&&ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=G.volume*.38;master.connect(ac.destination);G.sound=true;beat=0;playBeat();playTimer=setInterval(playBeat,60000/MUSIC_PRESETS[G.soundStyle].bpm/2);$('#music').classList.add('on');persist()}
function toggleMusic(){if(G.sound)stopMusic();else startMusic()}
function soundSettings(){const e=G.sound;modal('⚙ 音樂與遊戲設定',`目前音樂：<b>${MUSIC_PRESETS[G.soundStyle].name}</b><br>音量：<span id="volume-label">${Math.round(G.volume*100)}%</span><input id="volume-range" type="range" min="0" max="100" value="${Math.round(G.volume*100)}" style="width:100%;accent-color:#67d6d2"><br>播放規則：0 張工單 10×、1～4 張 1×、5 張暫停。<br>目前員工：${G.employees.length} 人。儲存為獨立 v0.4 新遊戲。`,[{text:'♫ 切換音樂',cls:'secondary',click:()=>{G.soundStyle=(G.soundStyle+1)%3;const was=G.sound;if(was)stopMusic();G.sound=false;if(was)startMusic();inform('配樂切換：'+MUSIC_PRESETS[G.soundStyle].name);persist()}},{text:'關閉',cls:'primary',click:()=>{}}]);$('#volume-range').oninput=e=>{G.volume=+e.target.value/100;$('#volume-label').textContent=Math.round(G.volume*100)+'%';if(master)master.gain.value=G.volume*.38;persist()}}
function startupModal(){if(G.infra.opened)return;modal('🏗 歡迎接手一間空白公司',`<b>Network Architect v0.4｜全新創業模式</b><br>員工：0、Access Switch：0、開業狀態：尚未營運。<br>從機櫃、ISP、路由器、防火牆、CORE 與 Access Switch 開始，透過 CLI 設定 VLAN / Trunk 並通過驗收，公司才會開始招募。<br><span style="color:#a7e9d9">這是全新的遊戲進度，不會讀取舊版存檔。</span>`,[{text:'開始從零建置',cls:'primary',click:()=>nav('build')},{text:'先看辦公室',cls:'secondary',click:()=>nav('office')}])}
function bind(){$$('.nav').forEach(e=>e.onclick=()=>nav(e.dataset.view));$$('[data-floor]').forEach(e=>e.onclick=()=>{G.floor=+e.dataset.floor;renderOffice();persist()});$$('[data-cat]').forEach(e=>e.onclick=()=>{G.buildCat=e.dataset.cat;renderBuild();persist()});$$('[data-ticket-tab]').forEach(e=>e.onclick=()=>{G.ticketTab=e.dataset.ticketTab;ticPage=0;renderTickets();persist()});$('#music').onclick=toggleMusic;$('#settings').onclick=soundSettings;$('#term-help-toggle').onclick=()=>{termDetails=!termDetails;updateTermHelp()};$('#term-form').addEventListener('submit',e=>{e.preventDefault();const inp=$('#cli');const v=inp.value;inp.value='';cliProcess(v);inp.focus()});$$('[data-term]').forEach(b=>b.onclick=()=>termCommand(b.dataset.term));let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});document.addEventListener('touchend',e=>{if(e.changedTouches.length!==1)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;const target=e.target;if(target?.closest('input,button,#terminal,.term-shortcuts,.device-row,#overlay'))return;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.4){const arr=['office','build','term','tickets','learn'],idx=arr.indexOf(page),next=idx+(dx<0?1:-1);if(next>=0&&next<arr.length)nav(arr[next])}},{passive:true});if(window.visualViewport){const adjust=()=>{const active=document.activeElement===$('#cli');const height=window.visualViewport.height;document.body.classList.toggle('kbd',active&&height<window.innerHeight-105);document.documentElement.style.setProperty('--keyboard-height',`${height}px`)};window.visualViewport.addEventListener('resize',adjust);$('#cli').addEventListener('blur',()=>setTimeout(adjust,50));$('#cli').addEventListener('focus',()=>setTimeout(adjust,50));}document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});window.addEventListener('beforeunload',persist)}
// Helper for new switches: commission pretested template, without faking a hardware port beyond capacity.
function commission(){const sw=accList().find(d=>!usable(d));if(!sw){inform('沒有待部署的 Access Switch');return}if(!G.infra.opened){inform('第一台交換器需要手動完成 CLI 驗收');nav('term');return}if(!spend(3500))return;sw.linked=true;sw.online=true;sw.vlans=[...new Set([...sw.vlans,10,20])];sw.trunk=true;sw.allowed='10,20';sw.saved=true;wiredPlan();addLog(`以已驗證組態範本部署 ${sw.id}，新增 ${sw.type==='access'?20:40} 個員工埠`);inform(`部署完成 ${sw.id}，容量 ${G.employees.length}/${cap()}`);render();persist()}
// Post-open dynamic switch commission button in capacity panel.
const renderBuildOrig=renderBuild;renderBuild=function(){renderBuildOrig();const sw=accList().find(d=>!usable(d));if(G.infra.opened&&sw){$('#build-instruction').textContent=`${sw.id} 已上架，尚未設定 VLAN / Trunk。要先部署完成，才有 ${sw.type==='access'?20:40} 個員工 Port 可用。`;$('#build-guide').textContent=`部署 ${sw.id} 模板`;$('#build-guide').onclick=commission;$('#build-check').textContent='查看教學／容量';$('#build-check').onclick=()=>nav('learn')}};
// Persist per-worker switch assignments; avoid rendering hundreds of worker sprites at once.
const renderTopOrig=renderTop;renderTop=function(){renderTopOrig();const devs=accList().length;$('#k-switch').parentElement.title=`Access 交換器 ${devs} 台；僅計算已佈線、已配置 VLAN + Trunk 的設備`;};
window.addEventListener('error',e=>{console.error('NetSim error',e.error||e.message)});
bind();if(!G.devices.length)selectedDevice='';else selectedDevice=G.devices[0].id;G.sound=false;render();setInterval(tick,1000);setTimeout(startupModal,320);
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
